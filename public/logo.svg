<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C55A"/>
      <stop offset="40%" stop-color="#D4A030"/>
      <stop offset="100%" stop-color="#9D671E"/>
    </linearGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1520"/>
      <stop offset="100%" stop-color="#2D2038"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8D98A"/>
      <stop offset="50%" stop-color="#E8C55A"/>
      <stop offset="100%" stop-color="#C89433"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Logo Mark: Octagonal mystical compass -->
  <g transform="translate(60, 70)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.15" stroke-dasharray="3 5"/>

    <!-- Octagonal frame -->
    <polygon points="0,-44 31,-31 44,0 31,31 0,44 -31,31 -44,0 -31,-31" fill="url(#markBg)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#glow)"/>

    <!-- Inner octagon -->
    <polygon points="0,-32 22,-22 32,0 22,22 0,32 -22,22 -32,0 -22,-22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>

    <!-- Stylized star in center -->
    <g transform="scale(0.65)" filter="url(#glow)">
      <!-- 4-point star -->
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="url(#starGrad)"/>
      <!-- Cross lines -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
      <!-- Diagonal lines -->
      <line x1="-15" y1="-15" x2="15" y2="15" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.15"/>
      <line x1="15" y1="-15" x2="-15" y2="15" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.15"/>
    </g>

    <!-- Decorative corner dots -->
    <circle cx="0" cy="-38" r="2" fill="url(#starGrad)" opacity="0.7"/>
    <circle cx="38" cy="0" r="2" fill="url(#starGrad)" opacity="0.7"/>
    <circle cx="0" cy="38" r="2" fill="url(#starGrad)" opacity="0.7"/>
    <circle cx="-38" cy="0" r="2" fill="url(#starGrad)" opacity="0.7"/>
  </g>

  <!-- Brand Text -->
  <g transform="translate(140, 72)">
    <!-- Main title -->
    <text x="0" y="0" fill="url(#goldGrad)" font-size="42" font-family="serif" font-weight="900" letter-spacing="6" filter="url(#glow)">星命局</text>
    <!-- Subtitle -->
    <text x="2" y="24" fill="#9D671E" font-size="13" font-family="sans-serif" font-weight="600" letter-spacing="8" opacity="0.8">AI 运势技能商店</text>
    <!-- Decorative line -->
    <line x1="0" y1="-10" x2="240" y2="-10" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.25"/>
  </g>
</svg>
