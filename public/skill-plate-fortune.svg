<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="bluePlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="whitePlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="plateShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="400" height="320" rx="20" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#60A5FA" stroke-width="0.5">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
  </g>
  
  <!-- Speed/energy lines -->
  <g opacity="0.08" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="100" x2="80" y2="100"/>
    <line x1="10" y1="130" x2="55" y2="130"/>
    <line x1="345" y1="180" x2="390" y2="180"/>
    <line x1="320" y1="210" x2="370" y2="210"/>
  </g>
  
  <!-- Outer plate border (metal effect) -->
  <rect x="65" y="70" width="270" height="140" rx="16" fill="url(#metal)" filter="url(#plateShadow)"/>
  
  <!-- Blue plate background -->
  <rect x="72" y="77" width="256" height="126" rx="10" fill="url(#bluePlate)"/>
  
  <!-- White inner plate area -->
  <rect x="84" y="89" width="232" height="102" rx="5" fill="url(#whitePlate)"/>
  
  <!-- Rivets -->
  <g fill="#CBD5E1" stroke="#94A3B8" stroke-width="1">
    <circle cx="100" cy="105" r="5"/>
    <circle cx="300" cy="105" r="5"/>
    <circle cx="100" cy="175" r="5"/>
    <circle cx="300" cy="175" r="5"/>
  </g>
  
  <!-- Division bar -->
  <rect x="160" y="93" width="2" height="94" fill="#E2E8F0" rx="1"/>
  
  <!-- Province code -->
  <text x="130" y="152" text-anchor="middle" fill="#1E40AF" font-size="30" font-family="sans-serif" font-weight="900" letter-spacing="1">京A</text>
  
  <!-- Number -->
  <text x="238" y="134" text-anchor="middle" fill="#2563EB" font-size="36" font-family="monospace" font-weight="900" letter-spacing="4" filter="url(#textGlow)">88888</text>
  
  <!-- Plate bottom text -->
  <text x="200" y="180" text-anchor="middle" fill="#94A3B8" font-size="9" font-family="sans-serif" letter-spacing="2">CHINA</text>
  
  <!-- Subtitle below plate -->
  <text x="200" y="258" text-anchor="middle" fill="#64748B" font-size="16" font-family="sans-serif" font-weight="600" letter-spacing="4">车牌测吉凶</text>
  
  <text x="200" y="280" text-anchor="middle" fill="#475569" font-size="10" font-family="sans-serif" letter-spacing="2" opacity="0.7">PLATE FORTUNE</text>
  
  <!-- Decorative accent lines -->
  <line x1="100" y1="296" x2="300" y2="296" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
</svg>
