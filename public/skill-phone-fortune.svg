<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0720"/>
      <stop offset="50%" stop-color="#1A1040"/>
      <stop offset="100%" stop-color="#120830"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B2F6E"/>
      <stop offset="50%" stop-color="#2D1B60"/>
      <stop offset="100%" stop-color="#1A0F40"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="energyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="signalGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="320" rx="20" fill="url(#bg)"/>
  
  <!-- Energy concentric rings -->
  <g opacity="0.12">
    <circle cx="200" cy="140" r="130" fill="none" stroke="#8B5CF6" stroke-width="0.5"/>
    <circle cx="200" cy="140" r="110" fill="none" stroke="#8B5CF6" stroke-width="0.7"/>
    <circle cx="200" cy="140" r="90" fill="none" stroke="#8B5CF6" stroke-width="1"/>
  </g>
  
  <!-- Energy glow halo -->
  <circle cx="200" cy="140" r="100" fill="url(#energyGlow)"/>
  
  <!-- Decorative orbiting dots -->
  <g opacity="0.25">
    <circle cx="130" cy="90" r="2" fill="#C4B5FD"/>
    <circle cx="280" cy="70" r="1.5" fill="#A78BFA"/>
    <circle cx="300" cy="180" r="2.5" fill="#C4B5FD"/>
    <circle cx="110" cy="200" r="2" fill="#A78BFA"/>
    <circle cx="160" cy="260" r="1.5" fill="#C4B5FD"/>
    <circle cx="260" cy="250" r="2" fill="#A78BFA"/>
  </g>
  
  <!-- Phone body -->
  <rect x="158" y="50" width="84" height="170" rx="20" fill="url(#phoneBody)" stroke="#6D4AFF" stroke-width="1.5" filter="url(#phoneGlow)"/>
  
  <!-- Phone edge highlight -->
  <rect x="162" y="54" width="76" height="162" rx="17" fill="none" stroke="#8B6FE8" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Screen -->
  <rect x="168" y="64" width="64" height="118" rx="10" fill="url(#screenGrad)" opacity="0.35"/>
  
  <!-- Screen content: signal bars -->
  <g filter="url(#signalGlow)">
    <rect x="188" y="82" width="5" height="16" rx="2.5" fill="#D9D0FF" opacity="0.9"/>
    <rect x="197" y="76" width="5" height="22" rx="2.5" fill="#D9D0FF" opacity="0.9"/>
    <rect x="206" y="70" width="5" height="28" rx="2.5" fill="#D9D0FF" opacity="0.9"/>
  </g>
  
  <!-- Screen content: digits -->
  <g opacity="0.5">
    <text x="200" y="130" text-anchor="middle" fill="#E8E0FF" font-size="11" font-family="monospace" letter-spacing="5">1 3 9</text>
    <text x="200" y="150" text-anchor="middle" fill="#D0C4FF" font-size="11" font-family="monospace" letter-spacing="5">8 8 8 8</text>
  </g>
  
  <!-- Screen: home indicator -->
  <rect x="188" y="172" width="24" height="4" rx="2" fill="#D9D0FF" opacity="0.5"/>
  
  <!-- Phone notch -->
  <rect x="185" y="54" width="30" height="6" rx="3" fill="#120830" opacity="0.6"/>
  
  <!-- Phone camera dot -->
  <circle cx="208" cy="57" r="2.5" fill="#3B2F6E" opacity="0.8"/>
  
  <!-- Subtitle -->
  <text x="200" y="260" text-anchor="middle" fill="#A78BFA" font-size="16" font-family="sans-serif" font-weight="600" letter-spacing="4">手机号测吉凶</text>
  
  <text x="200" y="282" text-anchor="middle" fill="#7C5CC8" font-size="10" font-family="sans-serif" letter-spacing="2" opacity="0.7">PHONE FORTUNE</text>
  
  <!-- Bottom accent -->
  <line x1="100" y1="298" x2="300" y2="298" stroke="#6D28D9" stroke-width="1" opacity="0.25"/>
</svg>
